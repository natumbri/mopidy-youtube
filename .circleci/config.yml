version: 2.1

# Use the official Python orb to simplify setup and package installation
orbs:
  python: circleci/python@3.0.0

jobs:
  build-and-test:
    executor: python/default
    steps:
      - run:
          name: Force Git to use HTTPS
          command: |
            # Forces git to translate any ssh/git URLs into secure HTTPS URLs
            git config --global url."https://github.com/".insteadOf "git@github.com:"
            git config --global url."https://".insteadOf "git://"
      
      - checkout


      # 2. Install Python dependencies from requirements.txt using pip
      - python/install-packages:
          pkg-manager: pip
          # Uncomment and adjust if your requirements file is named differently or located in a subfolder:
          # pip-dependency-file: requirements.txt

      # 3. Run pytest and store test results
      - run:
          name: Run pytest
          command: |
            pytest --junitxml=test-results/junit.xml

      # 4. Upload test results to CircleCI UI (Optional but recommended)
      - store_test_results:
          path: test-results

      # 5. Save artifacts (Optional)
      - store_artifacts:
          path: test-results
          destination: tr1

workflows:
  test-workflow:
    jobs:
      - build-and-test

