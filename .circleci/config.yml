version: 2.1

orbs:
  python: circleci/python@4.0.0

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.13
    steps:
      - run:
        name: Install System Dependencies for Cairo
        command: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config
      - run:
          name: Force Git to use HTTPS
          command: |
            # Forces git to translate any ssh/git URLs into secure HTTPS URLs
            git config --global url."https://github.com/".insteadOf "git@github.com:"
            git config --global url."https://".insteadOf "git://"

      - checkout
      
      # For Poetry projects
      - python/install-packages:
          pkg-manager: poetry
          cache-key-override: 'poetry-{{ checksum "pyproject.toml" }}'

      
      # OR for UV projects (fast modern installer)
      # - run:
      #     name: Install dependencies with uv
      #     command: pip install uv && uv sync

      - run:
          name: Run tests with pytest
          command: poetry run pytest # or 'uv run pytest' or 'pytest'

workflows:
    version: 2.1
    test-workflow:
      jobs:
        - build-and-test
