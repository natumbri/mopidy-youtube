[project]
name = "Mopidy-YouTube"
version = "4.0.3"
description = "Mopidy extension for YouTube"
readme = "README.rst"
requires-python = ">= 3.13"
license = { text = "Apache-2.0"}
license-files = ["LICENSE"]
authors = [{ name = "nik tumbri", email = "natumbri@gmail.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "cachetools >= 5.5",
    "mopidy >= 4.0.0",
    "pykka >= 4.1",
    "requests >= 2.32",
    "yt-dlp",
]

[project.optional-dependencies]
musicapi = ["ytmusicapi >= 1.0"]

[project.urls]
Homepage = "https://github.com/natumbri/mopidy-youtube"

[project.entry-points."mopidy.ext"]
youtube = "mopidy_youtube:Extension"


[build-system]
requires = ["setuptools >= 75"]
build-backend = "setuptools.build_meta"


[dependency-groups]
dev = [
    "tox",
    "tox-uv",
    { include-group = "ruff" },
    { include-group = "tests" },
    { include-group = "typing" },
]
ruff = ["ruff"]
tests = ["pytest >= 8.3", "pytest-cov >= 5.0", "ytmusicapi >= 1.0"]
typing = ["pyright"]


[tool.setuptools.packages.find]
include = ["mopidy_youtube*"]

[tool.setuptools.package-data]
mopidy_youtube = ["ext.conf", "www/*.html"]


[tool.coverage.run]
source_pkgs = ["mopidy_youtube"]

[tool.coverage.report]
show_missing = true


[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["mopidy_youtube"]
# Not all dependencies have type hints:
reportMissingTypeStubs = false
# Already covered by ruff's flake8-self checks:
reportPrivateImportUsage = false


[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",  # any-type
    "CPY",     # flake8-copyright
    "D",       # pydocstyle
    "D203",    # one-blank-line-before-class
    "D213",    # multi-line-summary-second-line
    "FIX002",  # line-contains-todo
    "G004",    # logging-f-string
    "SLF001",  # private-member-access
    "TD002",   # missing-todo-author
    "TD003",   # missing-todo-link
    "TRY003",  # raise-vanilla-args
    #
    # Conflicting with `ruff format`
    "COM812",  # missing-trailing-comma
    "ISC001",  # single-line-implicit-string-concatenation
    #
    # Deferred: each needs a judgement call (which exceptions to catch, how to split
    # the large API-parsing functions, whether to rename public names)
    "A002",    # builtin-argument-shadowing  # TODO
    "BLE001",  # blind-except  # TODO
    "C901",    # complex-structure  # TODO
    "N802",    # invalid-function-name  # TODO
    "N803",    # invalid-argument-name  # TODO
    "PLR0912", # too-many-branches  # TODO
    "PLR0915", # too-many-statements  # TODO
    "PLR2004", # magic-value-comparison  # TODO
]

[tool.ruff.lint.per-file-ignores]
"mopidy_youtube/apis/__init__.py" = [
    "ARG002",  # the placeholder api ignores its arguments
]
"tests/*" = [
    "ANN201",  # missing-return-type-undocumented-public-function
    "ANN202",  # missing-return-type-private-function
    "ANN204",  # missing-return-type-special-method
    "ARG",     # flake8-unused-arguments
    "FBT",     # flake8-boolean-trap
    "PLR0913", # too-many-arguments
    "PLR2004", # magic-value-comparison
    "PT027",   # pytest-unittest-raises-assertion
    "S101",    # assert
    "TRY002",  # raise-vanilla-class
]

[tool.ruff.lint.isort]
known-first-party = ["mopidy_youtube"]
known-local-folder = ["tests"]


[tool.tox]
env_list = [
    "3.13-lowest",
    "3.13",
    "3.14",
    "pyright",
    "ruff-check",
    "ruff-format",
]

[tool.tox.env_run_base]
package = "wheel"
wheel_build_env = ".pkg"
dependency_groups = ["tests"]
commands = [
    [
        "pytest",
        "--cov",
        "--basetemp={envtmpdir}",
        { replace = "posargs", extend = true },
    ],
]

[tool.tox.env."3.13-lowest"]
base_python = ["python3.13"]
uv_resolution = "lowest-direct"

[tool.tox.env.pyright]
dependency_groups = ["tests", "typing"]
commands = [["pyright", "{posargs:mopidy_youtube}"]]

[tool.tox.env.ruff-check]
skip_install = true
dependency_groups = ["ruff"]
commands = [["ruff", "check", "{posargs:.}"]]

[tool.tox.env.ruff-format]
skip_install = true
dependency_groups = ["ruff"]
commands = [["ruff", "format", "--check", "--diff", "{posargs:.}"]]
